name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:package
      # tsrs ports TypeScript 7.1 beta, so it reports only; `pnpm check` is the gate.
      - name: tsrs check (informational)
        if: matrix.node == 24
        continue-on-error: true
        run: pnpm check:tsrs
