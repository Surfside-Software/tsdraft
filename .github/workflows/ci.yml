name: CI

# The `export` branch runs through its pull request, which the Export PR workflow opens.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push cancels the run it replaces, except on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:package
      # tsrs ports TypeScript 7.1 beta, so it reports only; `pnpm check` is the gate.
      - name: tsrs check (informational)
        if: matrix.node == 24
        continue-on-error: true
        run: pnpm check:tsrs
